services:
  - type: web
    name: razorshield-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: RazorShield AI
      - key: APP_MODE
        value: dev
      - key: DEBUG
        value: "true"
      - key: NO_KAFKA
        value: "true"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./razorshield.db
      - key: DATABASE_SYNC_URL
        value: sqlite:///./razorshield.db
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        value: razorshield-dev-key
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
